; ESP32-CAM (AI-Thinker) dynamic sign-gesture detector
; Framework is ESP-IDF (not Arduino): esp-tflite-micro and esp-dl are
; ESP-IDF components only. PlatformIO is kept as the build tool.
;
; Requires a USB-TTL adapter - the ESP32-CAM has no USB port.
;   5V -> 5V, GND -> GND, TX -> U0R, RX -> U0T, IO0 -> GND (flash mode only)

[platformio]
default_envs = esp32cam
src_dir = src

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = espidf

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 1782579
upload_protocol = esptool
upload_speed = 460800

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra

; Personalisation:
;   [env:esp32cam]
;   build_flags =
;       ${env:esp32cam.build_flags}
;       -DAPP_WIFI_SSID=\"my-network\"
;       -DAPP_WIFI_PASS=\"my-password\"
